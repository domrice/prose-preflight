# Bundled config. A user file passed with --config is deep-merged over this one.
# Rule keys land here alongside their checkers; a new document convention is a
# YAML edit, never a code change.

# Agent-facing. Never read by a checker; echoed into the report so the agent driving
# prose-preflight and prose-deepread knows what this document is meant to be.
# Written by the prose-init skill.
contract:
  document: null # journal article | thesis chapter | report | proposal | docs
  audience: null # who reads it, and what they already know
  venue: null # journal, conference, course, or team -- and its style guide
  voice: null # person, tense, passive/active, formality
  notes: null # anything else: banned words, citation style, house rules
  format: null # md | tex | txt -- what prose-draft writes, and its comment syntax

checks:
  terminology:
    enabled: true
    severity: warning
    ignore_case: true
    # Preferred form: variants that should become it. Empty by default -- the right
    # spellings are your journal's, not ours. Uncomment and edit:
    terms: {}
      # dataset: [data set, data-set]
      # machine learning: [machine-learning]
      # ground truth: [ground-truth, groundtruth]
  readability:
    enabled: true
    severity: warning
    min_words: 50 # sections shorter than this score as noise
    min_flesch: 30.0 # below: hard to read
    max_fog: 18.0 # above: too many long words per sentence
  sentence_length:
    enabled: true
    severity: warning
    max_words: 40
  acronym:
    enabled: true
    severity: warning
    min_uses: 1 # raise to ignore one-off mentions
    # never expanded: too common, or not really acronyms
    allowlist:
      [
        API,
        CPU,
        GPU,
        RAM,
        PDF,
        HTML,
        JSON,
        YAML,
        XML,
        CSV,
        URL,
        USA,
        EU,
        UK,
        ID,
        OK,
        TODO,
        FAQ,
        PhD,
        DOI,
        ISBN,
        GDP,
        AM,
        PM,
        UTC,
        ISO,
        IEEE,
        ACM,
      ]
  structure:
    enabled: true
    severity: error # a missing section
    order_severity: warning # a section out of order
    # Empty by default: most documents are fragments, not whole papers. Set the list to
    # opt in, e.g. [Abstract, Introduction, Methods, Results, Discussion, References].
    required_sections: []
  units:
    enabled: true
    severity: warning
    disabled_rules: [] # any of: space_before_unit, percent_spacing, range_dash, p_value_spacing
    units:
      [
        mm,
        cm,
        m,
        km,
        mg,
        g,
        kg,
        ms,
        s,
        min,
        h,
        Hz,
        kHz,
        MHz,
        GHz,
        kB,
        MB,
        GB,
        TB,
        W,
        kW,
        V,
        A,
        K,
        °C,
        °F,
        px,
        dpi,
        bp,
        mol,
        N,
        Pa,
        J,
        kJ,
      ]
  claim:
    enabled: true # severity is always `review`; never auto-applied
    hedges:
      [
        may,
        might,
        could,
        possibly,
        perhaps,
        arguably,
        seems to,
        appears to,
        somewhat,
        relatively,
        fairly,
        rather,
        quite,
        suggests that,
        tends to,
      ]
    boosters:
      [
        clearly,
        obviously,
        undoubtedly,
        certainly,
        definitely,
        significantly,
        dramatically,
        drastically,
        vastly,
        extremely,
        profoundly,
        unprecedented,
        groundbreaking,
        revolutionary,
        novel,
        optimal,
        perfect,
        proves,
        proven,
      ]
  vale:
    enabled: true
    timeout: 60
    # Vale's own config, kept as data. Built-in `Vale.*` rules only: no `vale sync`,
    # no downloaded styles, so runs stay offline and deterministic. Point
    # `config_file` at your own .vale.ini to use styles you have synced.
    config_file: null
    ini: |
      MinAlertLevel = suggestion
      [*.{md,markdown,txt}]
      BasedOnStyles = Vale

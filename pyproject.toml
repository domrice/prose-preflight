[project]
name = "prose-preflight"
version = "0.1.0"
description = "Deterministic prose checkers for scientific writing, driven by an agent skill."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textstat", "pyyaml", "vale==3.21.0.0"]
authors = [{ name = "Dominik Reisach", email = "praises_sauces.0i@icloud.com " }]
keywords = ["prose", "proofreading", "linter", "scientific-writing", "agent-skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/domrice/prose-preflight"
Issues = "https://github.com/domrice/prose-preflight/issues"

[project.scripts]
prose-preflight = "prose_preflight.run_all:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prose_preflight"]
